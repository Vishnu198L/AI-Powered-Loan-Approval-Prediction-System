services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: vishnu178l/loan-approval-backend:latest
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: vishnu178l/loan-approval-frontend:latest
    ports:
      - "8502:8501"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped