services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: loan_backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: loan_frontend
    ports:
      - "8502:8501"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped